<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Treino</title>
<link rel="manifest" href="manifest.webmanifest">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.109.0/dist/umd/supabase.js"></script>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#111418">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meu Treino">

<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f27;--mu:#6b7280;--ac:#2563eb;--acx:#fff;--bd:#e3e6eb;--ok:#16a34a;--in:#fff8e1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1c2128;--tx:#eef0f3;--mu:#98a1ad;--ac:#5b8def;--acx:#0b1220;--bd:#2c333d;--ok:#4ade80;--in:#2a2615;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111418;--card:#1c2128;--tx:#eef0f3;--mu:#98a1ad;--ac:#5b8def;--acx:#0b1220;--bd:#2c333d;--ok:#4ade80;--in:#2a2615;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,Arial,sans-serif;max-width:560px;margin-inline:auto;padding:0 12px 40px}
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:10px 0 8px;z-index:5}
.tabs{display:flex;gap:6px;overflow-x:auto}
.tabs button{flex:1;min-width:52px;padding:10px 4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:14px;font-weight:600}
.tabs button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.wk{display:flex;align-items:center;justify-content:space-between;margin-top:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:6px}
.wk button{width:44px;height:40px;border:0;background:var(--bg);color:var(--tx);border-radius:8px;font-size:20px}
.wk b{font-size:16px}
h2{font-size:17px;margin:14px 2px 8px}
.ex{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.ex.done{border-color:var(--ok)}
.r1{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.nm{font-weight:600}.sr{color:var(--mu);font-size:14px;white-space:nowrap}
.r2{display:flex;align-items:center;gap:8px;margin-top:10px}
.r2 input[type=number]{flex:1;min-width:0;height:44px;border:1px solid var(--bd);background:var(--in);color:var(--tx);border-radius:10px;font-size:18px;text-align:center}
.r2 button{width:44px;height:44px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;font-size:20px}
.r2 .ck{width:auto;padding:0 12px;font-size:14px}
.ex.done .ck{background:var(--ok);color:#fff;border-color:var(--ok)}
.hint{color:var(--mu);font-size:13px;margin-top:6px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:10px}
.bar{height:10px;background:var(--bg);border-radius:6px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--ac)}
.row{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--bd);font-size:15px}
.big{display:flex;gap:8px;margin-top:10px}.big input{flex:1;min-width:0;height:46px;border:1px solid var(--bd);background:var(--in);color:var(--tx);border-radius:10px;font-size:18px;text-align:center}
.big button{padding:0 18px;border:0;background:var(--ac);color:var(--acx);border-radius:10px;font-weight:700;font-size:15px}
.tip{color:var(--mu);font-size:13px;margin:6px 2px}
.tl{display:flex;justify-content:space-between;align-items:center;gap:6px}
.ex{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ex input{-webkit-user-select:text;user-select:text}
.ex.drag{position:relative;z-index:20;border-color:var(--ac);box-shadow:0 10px 28px rgba(0,0,0,.3);transition:none}
.ex{-webkit-tap-highlight-color:transparent}
.dbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.dbar b{font-size:16px}
.dbar button{width:44px;height:38px;border:0;background:var(--bg);color:var(--tx);border-radius:8px;font-size:20px}
.st{display:flex;gap:8px}
.st button{flex:1;height:46px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;font-weight:600;font-size:15px}
.st button.sel{background:var(--ok);border-color:var(--ok);color:#fff}
.st button.nok{background:#d97706;border-color:#d97706;color:#fff}
.lk{border:0;background:none;color:var(--ac);font-weight:600;padding:0;font-size:inherit}
.wbar{margin:0 0 10px}.wbar i{background:var(--wa,#38bdf8)}
.wt{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wt button{height:60px;border:1px solid var(--bd);background:var(--card);color:var(--mu);border-radius:12px;font-size:13px;white-space:pre-line;line-height:1.3}
.wt button.on{background:var(--wa,#38bdf8);border-color:var(--wa,#38bdf8);color:#fff}
.hs{overflow-x:auto;position:relative;padding:18px 0 6px}
.hm{display:flex;gap:3px;width:max-content}
.hc{display:flex;flex-direction:column;gap:3px;position:relative}
.ml{position:absolute;top:-16px;left:0;font-size:11px;color:var(--mu);white-space:nowrap}
.c{width:12px;height:12px;border-radius:3px;background:var(--bd);display:block}
.c.g{background:var(--ok)}.wm .c.g{background:var(--wa,#38bdf8)}
.c.f{opacity:.4}.c.e{background:transparent}.c.t{box-shadow:0 0 0 2px var(--ac)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{display:flex;align-items:center;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
.chip input{border:0;background:none;color:var(--tx);font:inherit;width:96px;height:38px;padding:0 6px}
.chip button{border:0;background:none;color:var(--mu);width:30px;height:38px;font-size:18px}
.tabs button[data-t="Peso"]{flex:2;min-width:96px}
.grip{flex:none;width:44px;height:34px;display:flex;align-items:center;justify-content:center;margin-left:6px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--mu);font-size:20px;line-height:1;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
.mv{display:flex;flex:none}.mv button{width:38px;height:32px;border:1px solid var(--bd);background:var(--bg);color:var(--mu);border-radius:8px;margin-left:6px;font-size:14px}
.pl{width:100%;height:46px;border:1px dashed var(--bd);background:none;border-radius:12px;color:var(--ac);font-weight:600;margin-bottom:8px;font-size:15px}
.add{display:flex;gap:6px;margin-bottom:6px}
.add input{flex:1;min-width:0;height:44px;border:1px solid var(--bd);background:var(--in);color:var(--tx);border-radius:10px;padding:0 10px;font-size:16px}
.add button{flex:1;height:44px;border:0;border-radius:10px;background:var(--ac);color:var(--acx);font-weight:600}
.add button.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}

.md{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.mb{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:18px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
.mb p{color:var(--mu);font-size:14px;margin:8px 0 12px}
.mb input{width:100%;height:46px;border:1px solid var(--bd);background:var(--in);color:var(--tx);border-radius:10px;padding:0 12px;font-size:16px;margin-bottom:8px}
.mbs{display:flex;flex-direction:column;gap:8px;margin:8px 0 12px}.mbs.r{flex-direction:row}.mbs.r button{flex:1}
.mbs button{height:46px;border:0;border-radius:10px;background:var(--ac);color:var(--acx);font-weight:600;font-size:15px}
.mbs button.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.sy{font-size:12px;color:var(--mu);text-align:right;padding:0 2px 4px;min-height:16px}
</style>
</head>
<body>
<div class="top">
<div class="sy" id="sy"></div>
<div class="tabs" id="tabs"></div>
<div class="wk" id="wk"><button id="prev" aria-label="Semana anterior">‹</button><b id="wl"></b><button id="next" aria-label="Próxima semana">›</button></div>
</div>
<div id="main"></div>
<script>
var DAYS={
"Seg":["Peito, ombro e tríceps",[["Supino reto com barra","4x6-8",2.5],["Supino inclinado com halteres","3x8-10",1],["Desenvolvimento com halteres","3x8-10",1],["Elevação lateral","3x12-15",1],["Tríceps corda","3x10-12",1],["Tríceps pulley supinado","2x10-12",1]]],
"Ter":["Costas e bíceps",[["Puxada frontal aberta","4x8-10",2.5],["Remada Hammer","3x8-10",2.5],["Remada baixa no cabo","3x10",2.5],["Fly inverso","3x12-15",1],["Rosca direta barra W","3x8-10",2.5],["Rosca martelo","2x10-12",1]]],
"Qua":["Pernas (pesado)",[["Agachamento com barra","4x6-8",2.5],["Leg press 45°","3x10-12",5],["Stiff","3x8-10",2.5],["Mesa flexora","3x10-12",2.5],["Panturrilha em pé","3x12-15",2.5],["Prancha","3x45 s",0]]],
"Qui":["Peito, ombro e tríceps (variação)",[["Supino inclinado na máquina","4x8-10",2.5],["Supino reto com halteres","3x8-10",1],["Peck deck ou crucifixo inclinado","3x12",2.5],["Elevação lateral","3x12-15",1],["Tríceps pulley com corda","3x10-12",1],["Tríceps corda por trás da cabeça","2x10-12",1]]],
"Sex":["Costas, bíceps e pernas leve",[["Barra fixa assistida","3x (1-2 reps da falha)",2.5],["Remada unilateral com halter","3x10",1],["Puxada supinada","3x10",2.5],["Rosca Scott","3x10",1],["Leg press 45°","3x12",5],["Cadeira extensora","3x12",2.5],["Elevação pélvica","3x12",2.5]]]
};
var KEYS=Object.keys(DAYS).concat(["Peso"]);
var S={tab:"Seg",week:1,loads:{},done:{},weights:{},start:60,goal:70};
var SK="treino:v1";var adding=false,editing=null;
try{var raw=localStorage.getItem(SK);if(raw){var o=JSON.parse(raw);for(var k in o)S[k]=o[k];}}catch(e){}
if(!S.items){S.items={};Object.keys(DAYS).forEach(function(k){S.items[k]=DAYS[k][1].map(function(e,i){return{id:String(i),n:e[0],sr:e[1],st:e[2]}})})}
if(!S.log)S.log={};if(!S.water)S.water={};if(!S.fired)S.fired={};if(!S.rem)S.rem={on:false,times:["09:00","11:00","13:00","15:00","17:00","19:00","21:00"]};if(S.next&&DAYS[S.next])S.tab=S.next;
function snap(){return{log:S.log,water:S.water,next:S.next,rem:S.rem,fd:S.fd,fired:S.fired,items:S.items,tab:S.tab,week:S.week,loads:S.loads,done:S.done,weights:S.weights,start:S.start,goal:S.goal,mt:S.mt||0}}
function save(touch){try{if(touch!==false)S.mt=Date.now();localStorage.setItem(SK,JSON.stringify(snap()))}catch(e){}if(touch!==false&&typeof cloudDirty==="function")cloudDirty()}
function lk(d,i,w){return d+"|"+i+"|"+w}
function prevLoad(d,i,w){for(var x=w-1;x>=1;x--){var v=S.loads[lk(d,i,x)];if(v!==undefined&&v!=="")return v+" kg (sem. "+x+")";}return null}
function tabs(){document.getElementById("tabs").innerHTML=KEYS.map(function(k){return '<button data-t="'+k+'" class="'+(k===S.tab?"on":"")+'">'+(k==="Peso"?"Dashboard":k)+'</button>'}).join("")}
function render(){
tabs();
document.getElementById("wl").textContent="Semana "+S.week+" de 24";
document.getElementById("wk").style.display=S.tab==="Peso"?"none":"flex";
var m=document.getElementById("main");
if(S.tab==="Peso"){return renderPeso(m)}
var d=S.tab,ex=S.items[d],h=dayBar()+'<h2>'+DAYS[d][0]+'</h2>';
ex.forEach(function(e){
var i=e.id,key=lk(d,i,S.week),v=S.loads[key]===undefined?"":S.loads[key],dn=S.done[key];
var pl=prevLoad(d,i,S.week);
h+='<div class="ex'+(dn?" done":"")+'" data-id="'+i+'">'+(editing===i?'<div class="add"><input id="en" type="text" maxlength="60" value="'+escq(e.n)+'"><input id="es" type="text" maxlength="24" value="'+escq(e.sr)+'" style="flex:none;width:90px"></div><div class="add"><button data-a="eok" data-i="'+i+'">Salvar</button><button class="g" data-a="eno">Cancelar</button></div>':'<div class="r1"><span class="nm" data-ed="'+i+'">'+esc(e.n)+'</span><span class="sr" data-ed="'+i+'">'+esc(e.sr)+'</span></div>')+
'<div class="r2">'+(e.st?'<button data-a="m" data-i="'+i+'">−</button>':'')+
'<input type="number" inputmode="decimal" step="0.5" min="0" placeholder="kg" value="'+v+'" data-i="'+i+'">'+
(e.st?'<button data-a="p" data-i="'+i+'">+</button>':'')+
'<button class="ck" data-a="c" data-i="'+i+'">'+(dn?"✓ Feito":"Feito")+'</button></div>'+
'<div class="hint tl"><span>'+(pl?"Última carga: "+pl:"Sem registro anterior")+'</span><span class="mv"><span class="grip" aria-label="Arrastar">⠿</span><button data-a="x" data-i="'+i+'" aria-label="Remover">×</button></span></div></div>';
});
if(adding)h+='<div class="add"><input id="nn" type="text" placeholder="Nome do exercício" maxlength="60"><input id="ns" type="text" placeholder="3x10" maxlength="24" style="flex:none;width:84px"></div><div class="add"><button data-a="ok">Adicionar</button><button class="g" data-a="no">Cancelar</button></div>';
else h+='<button class="pl" data-a="add">+ Adicionar exercício</button>';
h+=waterBox();
h+='<div class="tip">Completou todas as séries no topo das repetições? Suba a carga na próxima semana. Toque no nome ou nas séries para editar. Segure ⠿ (ou o nome) e arraste para reordenar; × remove.</div>';
m.innerHTML=h;
if(adding){var nn=document.getElementById("nn");if(nn)nn.focus();}
if(editing){var en=document.getElementById("en");if(en)en.focus()}
}
function addEx(){var n=document.getElementById("nn"),q=document.getElementById("ns"),v=n?n.value.trim():"";
if(v){S.items[S.tab].push({id:"u"+Date.now(),n:v,sr:(q&&q.value.trim())||"3x10",st:2.5});save();render();return}
adding=false;render();}
function esc(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function escq(t){return esc(t).replace(/"/g,"&quot;")}
function saveEdit(){var n=document.getElementById("en"),q=document.getElementById("es"),it=S.items[S.tab].filter(function(x){return x.id===editing})[0];
if(it&&n&&q){var v=n.value.trim();if(v)it.n=v;var sv=q.value.trim();if(sv)it.sr=sv;save()}
editing=null;render();}
var ld=ds(new Date()),remMsg="";
var MN=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"],MF=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"],WN=["dom","seg","ter","qua","qui","sex","sáb"];
function ds(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(x<10?"0":"")+x}
function pd(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2],12)}
function shift(s,n){var d=pd(s);d.setDate(d.getDate()+n);return ds(d)}
function lbl(s){var d=pd(s);return (s===ds(new Date())?"Hoje · ":"")+WN[d.getDay()]+", "+d.getDate()+"/"+(d.getMonth()+1)}
function dayBar(){
var g=S.log[ld],nx=S.next||"",txt="";
if(g&&g.t===0)txt='<div class="hint" style="margin-top:8px">Tudo bem! Este treino continua pendente: faça no próximo dia livre (sáb/dom valem) e siga a ordem. Não junte dois treinos no mesmo dia.</div>';
var nl=nx&&DAYS[nx]?'<div class="hint" style="margin-top:8px">Próximo na sequência: <button class="lk" data-t="'+nx+'">'+nx+' · '+DAYS[nx][0]+'</button></div>':"";
return '<div class="box"><div class="dbar"><button data-a="dm" aria-label="Dia anterior">‹</button><b>'+lbl(ld)+'</b><button data-a="dp" aria-label="Próximo dia">›</button></div><div class="st"><button class="'+(g&&g.t===1?"sel":"")+'" data-a="did">'+(g&&g.t===1?"✓ Treinei":"Treinei")+'</button><button class="'+(g&&g.t===0?"nok":"")+'" data-a="dno">'+(g&&g.t===0?"✕ Não treinei":"Não treinei")+'</button></div>'+txt+nl+'</div>';
}
function waterBox(){
var w=S.water[ld]||0,h='<h2>Água · '+(w*0.5).toFixed(1).replace(".",",")+' de 2 litros</h2><div class="bar wbar"><i style="width:'+Math.min(100,w/4*100)+'%"></i></div><div class="wt">';
for(var k=1;k<=4;k++)h+='<button data-wc="'+k+'" class="'+(w>=k?"on":"")+'">'+k+"\n500 ml</button>";
return h+'</div>';
}
function heat(title,k,fn,unit){
var Y=new Date().getFullYear(),st=new Date(Y,0,1,12);st.setDate(1-st.getDay());
var end=new Date(Y,11,31,12),today=ds(new Date()),cm=new Date().getMonth(),cnt=0,mc=0,d=new Date(st),cols="";
while(d<=end){
var col="",lab="";
for(var r=0;r<7;r++){
var s=ds(d);
if(d.getFullYear()===Y){var v=!!fn(s);if(v){cnt++;if(d.getMonth()===cm)mc++}
if(d.getDate()===1)lab=MN[d.getMonth()];
col+='<i class="c'+(v?" g":"")+(s>today?" f":"")+(s===today?" t":"")+'" data-d="'+s+'"></i>'}
else col+='<i class="c e"></i>';
d.setDate(d.getDate()+1)}
cols+='<div class="hc">'+(lab?'<span class="ml">'+lab+'</span>':"")+col+'</div>'}
return '<div class="box'+(k==="w"?" wm":"")+'" data-k="'+k+'"><b>'+title+'</b><div class="hs"><div class="hm">'+cols+'</div></div><div class="hint"><b>'+mc+'</b> '+unit+' em '+MF[cm]+' · '+cnt+' em '+Y+'</div><div class="hint hd">Toque num quadrado para ver o dia.</div></div>';
}
function dash(){
return '<h2>Treinos</h2>'+heat("Dias treinados","t",function(s){return S.log[s]&&S.log[s].t===1},"dias treinados")+'<h2>Água</h2>'+heat("Meta de 2 L batida","w",function(s){return (S.water[s]||0)>=4},"dias com meta batida");
}
function remBox(){
var h='<h2>Lembretes de água</h2><div class="box"><div class="st"><button class="'+(S.rem.on?"sel":"")+'" data-a="rt">'+(S.rem.on?"✓ Ligados":"Ativar lembretes")+'</button><button data-a="rtest">Testar</button></div><div class="chips">';
S.rem.times.forEach(function(t,i){h+='<span class="chip"><input type="time" data-rt="'+i+'" value="'+t+'"><button data-a="rx" data-i="'+i+'" aria-label="Remover">×</button></span>'});
return h+'</div><button class="pl" data-a="radd">+ Adicionar horário</button>'+(remMsg?'<div class="hint" style="color:var(--ac)">'+remMsg+'</div>':'')+'<div class="hint">Os avisos aparecem com o app aberto ou em segundo plano. Com o app totalmente fechado, o Android pode não disparar: para garantir, use também um alarme do relógio.</div></div>';
}
function remOn(){
if(typeof Notification==="undefined"){remMsg="Este navegador não suporta notificações.";render();return}
if(S.rem.on){S.rem.on=false;save();render();return}
Notification.requestPermission().then(function(p){
if(p==="granted"){S.rem.on=true;remMsg=""}else remMsg="Permissão negada. Libere as notificações do app nas configurações do Android.";
save();render();
}).catch(function(){remMsg="Não foi possível pedir permissão aqui. Use o app instalado (versão do GitHub).";render()});
}
function notify(txt){
var o={body:txt,icon:"icon-192.png",badge:"icon-192.png",tag:"agua",renotify:true},T="💧 Hora de beber água";
function fb(){try{new Notification(T,o)}catch(e){}}
if(navigator.serviceWorker&&navigator.serviceWorker.getRegistration){navigator.serviceWorker.getRegistration().then(function(r){if(r)r.showNotification(T,o);else fb()}).catch(fb)}else fb();
}
function tick(){
if(!S.rem||!S.rem.on||typeof Notification==="undefined"||Notification.permission!=="granted")return;
var n=new Date(),k=ds(n),nm=n.getHours()*60+n.getMinutes();
if(S.fd!==k){S.fd=k;S.fired={}}
if((S.water[k]||0)>=4)return;
